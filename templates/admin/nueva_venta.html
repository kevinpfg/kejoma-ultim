{% extends "admin/base.html" %}
{% block titulo %}Registrar venta{% endblock %}

{% block contenido %}
<h2 class="fw-bold mb-4">Registrar venta</h2>

<div class="card shadow-sm" style="max-width: 500px;">
    <div class="card-body p-4">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Producto *</label>
                <select name="id_producto" class="form-select" required>
                    <option value="">Selecciona...</option>
                    {% for p in productos %}
                        <option value="{{ p.id_producto }}">
                            {{ p.nombre }} ({{ p.marca }}) — ${{ "{:,.0f}".format(p.precio) }} — stock: {{ p.stock }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Cantidad *</label>
                <input type="number" min="1" name="cantidad" class="form-control" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check"></i> Registrar
                </button>
                <a href="{{ url_for('ventas') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
